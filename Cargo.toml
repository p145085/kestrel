[workspace]
resolver = "3"
members = [
    "crates/kestrel-call",
    "crates/kestrel-crypto",
    "crates/kestrel-media",
    "crates/kestrel-proto",
    "crates/kestrel-rtc-proto",
    "crates/kestrel-session",
    "crates/kestrel-net",
    "crates/kestrel-cli",
    "crates/kestrel-ui",
    "crates/kestreld-core",
    "crates/kestreld-services",
    "crates/kestreld",
    "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/p145085/kestrel"
authors = ["Kestrel contributors"]

[workspace.dependencies]
kestrel-call = { path = "crates/kestrel-call" }
kestrel-crypto = { path = "crates/kestrel-crypto" }
kestrel-proto = { path = "crates/kestrel-proto" }
kestrel-rtc-proto = { path = "crates/kestrel-rtc-proto" }
kestrel-session = { path = "crates/kestrel-session" }
kestrel-media = { path = "crates/kestrel-media" }
kestrel-net = { path = "crates/kestrel-net" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
async-channel = "2"
kestreld-core = { path = "crates/kestreld-core" }
kestreld-services = { path = "crates/kestreld-services" }
argon2 = { version = "0.5", features = ["std"] }
# OsRng lives behind rand_core's getrandom feature, which argon2 does not enable.
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
subtle = "2.6"
tokio = "1"
serde = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
# The ring provider rather than the aws-lc default: aws-lc-sys needs a C
# toolchain and NASM on Windows, which would make the build fragile on one
# of the three platforms this has to work on.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
sha2 = "0.10"
webpki-roots = "1"
rcgen = "0.13"
serde_json = "1"
serde_bytes = "0.11"
tempfile = "3"
memchr = "2.7"
thiserror = "2"
smallvec = { version = "1.13", features = ["union", "const_generics"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
