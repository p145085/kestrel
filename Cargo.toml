[workspace]
resolver = "3"
members = ["crates/kestrel-proto", "crates/kestreld-core"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/p145085/kestrel"
authors = ["Kestrel contributors"]

[workspace.dependencies]
kestrel-proto = { path = "crates/kestrel-proto" }
memchr = "2.7"
thiserror = "2"
smallvec = { version = "1.13", features = ["union", "const_generics"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
