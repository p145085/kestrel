[workspace]
resolver = "3"
members = [
    "crates/kestrel-proto",
    "crates/kestreld-core",
    "crates/kestreld-services",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/p145085/kestrel"
authors = ["Kestrel contributors"]

[workspace.dependencies]
kestrel-proto = { path = "crates/kestrel-proto" }
kestreld-core = { path = "crates/kestreld-core" }
kestreld-services = { path = "crates/kestreld-services" }
argon2 = { version = "0.5", features = ["std"] }
# OsRng lives behind rand_core's getrandom feature, which argon2 does not enable.
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
subtle = "2.6"
memchr = "2.7"
thiserror = "2"
smallvec = { version = "1.13", features = ["union", "const_generics"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
