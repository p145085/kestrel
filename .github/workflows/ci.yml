name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # The media crate needs GStreamer and the interface needs GTK; both
      # have jobs of their own that install what they need.
      - run: cargo clippy --workspace --exclude kestrel-media --exclude kestrel-ui --all-targets --all-features

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three targets from day one. The protocol crates are sans-io, so
        # this stays cheap until GTK4 and GStreamer arrive; keeping the matrix
        # green from the start is what stops platform rot accumulating.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Everything that needs no system libraries, which is what makes this
      # matrix cheap enough to keep green on all three platforms.
      - run: cargo test --all-features --workspace --exclude kestrel-media --exclude kestrel-ui

  media:
    name: Media engine (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A real call needs the webrtc, nice, dtls and srtp plugins, plus the
      # VP8 and Opus encoders. Test sources stand in for a camera and a
      # microphone, so no hardware is required.
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-nice \
            gstreamer1.0-libav
      - run: cargo test -p kestrel-media
      - run: cargo clippy -p kestrel-media --all-targets

  ui:
    name: Interface (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Linux is much the easiest place to get GTK 4, which is why the
      # interface is checked here rather than across the whole matrix.
      # Its command parsing and event routing are deliberately free of
      # widgets, so this needs no display server to run.
      - name: Install GTK 4
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - run: cargo test -p kestrel-ui
      - run: cargo clippy -p kestrel-ui --all-targets

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --exclude kestrel-media --exclude kestrel-ui
